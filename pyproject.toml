[project]
name = "slim-cz-v1"
version = "0.2.0"
description = "Slavic Linguistic integrated Micro-model for Czechia"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Filip Sedivy", email = "me@filipsedivy.com" }
]
license = { text = "MIT" }
keywords = [
    "nlp",
    "language-model",
    "transformer",
    "czech",
    "machine-learning",
    "deep-learning",
    "sentencepiece",
    "bpe-tokenizer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]

# Core dependencies
dependencies = [
    "torch>=2.0.0",
    "numpy>=2.0.0",
    "pyyaml>=6.0.0",
    "sentencepiece>=0.1.99",
    "pymupdf>=1.23.0",
    "chardet>=5.0.0",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.9.0",
    "bandit>=1.7.0",
    "mypy>=1.8.0",
]

tokenizer = [
    "tokenizers>=0.13.0",
]

monitoring = [
    "tqdm>=4.65.0",
    "tensorboard>=2.13.0",
]

analysis = [
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
]

all = [
    "slim-cz-v1[tokenizer,monitoring,analysis,dev]"
]

# CLI entry points
[project.scripts]
slim-extract-text = "slim_cz_v1.cli.extract_text:main"
slim-train-tokenizer = "slim_cz_v1.cli.train_tokenizer:main"
slim-tokenize-parallel = "slim_cz_v1.cli.tokenize_parallel:main"
slim-train = "slim_cz_v1.cli.train:main"
slim-inference = "slim_cz_v1.cli.inference:main"
slim-recommend = "slim_cz_v1.recommend_config:main"

[project.urls]
Homepage = "https://github.com/filipsedivy/SLiM-CZ-V1"
Repository = "https://github.com/filipsedivy/SLiM-CZ-V1"
Issues = "https://github.com/filipsedivy/SLiM-CZ-V1/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slim_cz_v1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "S101",   # assert used (OK in tests)
    "S603",   # subprocess call - check for execution of untrusted input
    "S607",   # start process with a partial path
    "E501",   # line too long (handled by formatter)
    # Intentional code patterns
    "N806",   # non-lowercase-variable-in-function (PyTorch convention: B, T, C)
    "N801",   # invalid-class-name (SLiM_CZ_V1 is intentional)
    "N812",   # lowercase-imported-as-non-lowercase (nn.functional as F)
    "RUF002", # ambiguous-unicode-character-docstring (Czech diacritics)
    "RUF001", # ambiguous-unicode-character-string (Czech diacritics)
    "RUF012", # mutable-class-default (class-level constants)
    "SIM102", # collapsible-if (readability preference)
    "SIM105", # contextlib.suppress suggestion
    "SIM108", # ternary operator suggestion (readability preference)
    "SIM113", # enumerate-for-loop suggestion
    "B005",   # strip-with-multi-characters (intentional character stripping)
    # TODO: Gradually fix these existing issues
    "PTH123", # builtin-open (migrate to pathlib)
    "PTH107", # os-remove
    "PTH105", # os-replace
    "PTH110", # os-path-exists
    "PTH118", # os-path-join
    "PTH207", # glob
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"slim_cz_v1/cli/**/*.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
